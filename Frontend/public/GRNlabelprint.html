<div style="page-break-after:always; width:285px; height:430px; margin:5px 0 5px 15px;">

    <table style="width:100%; height:100%; border-collapse:collapse; font-family:Arial;">

        <tr style="height:8%">
            <td style="width:40%; border:2px solid #000; padding-left:5px;">
                <b>GRN No :</b>
            </td>
            <td style="width:60%; border:2px solid #000; padding-left:5px;">
                <b>$GRNNO$</b>
            </td>
        </tr>


        <tr style="height:8%">
            <td style="border:2px solid #000; padding-left:5px;">
                <b>Item Code :</b>
            </td>
            <td style="border:2px solid #000; padding-left:5px;">
                <b>$ITEMCODE$</b>
            </td>
        </tr>

        <tr style="height:8%">
            <td style="border:2px solid #000; padding-left:5px;">
                <b>Item Name :</b>
            </td>
            <td style="border:2px solid #000; padding-left:5px;">
                <b>$ITEMNAME$</b>
            </td>
        </tr>

        <tr style="height:8%">
            <td style="border:2px solid #000; padding-left:5px;">
                <b>Quantity :</b>
            </td>
            <td style="border:2px solid #000; padding-left:5px;">
                <b>$QUANTITY$</b>
            </td>
        </tr>

        <tr style="height:8%">
            <td style="border:2px solid #000; padding-left:5px;">
                <b>Supplier :</b>
            </td>
            <td style="border:2px solid #000; padding-left:5px;">
                <b>$SUPPLIER$</b>
            </td>
        </tr>

        <tr style="height:8%">
            <td style="border:2px solid #000; padding-left:5px;">
                <b>GRN Date :</b>
            </td>
            <td style="border:2px solid #000; padding-left:5px;">
                <b>$GRNDATE$</b>
            </td>
        </tr>

        <!-- QR Code -->
        <tr style="height:36%">
            <td colspan="2" align="center" style="border:2px solid #000; vertical-align:middle;">

                $qrcode$

                <div style="margin-top:5px; font-size:12px; font-weight:bold;">
                    $BARCODE$
                </div>

            </td>
        </tr>

    </table>

</div>
